# Netlify configuration file

[build]
  publish = "dist"
  command = "npm run build"

# Headers configuration
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

# Cache static assets
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Service Worker
[[headers]]
  for = "/service-worker.js"
  [headers.values]
    Cache-Control = "no-cache"

# 404 handling for SPA
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Custom 404 with proper status code
[[redirects]]
  from = "/404"
  to = "/index.html"
  status = 404

# API Proxy (if needed)
[[redirects]]
  from = "/api/*"
  to = "https://api.cash-lvl.ru/api/:splat"
  status = 200
  force = true

# Force HTTPS
[[redirects]]
  from = "http://cash-lvl.ru/*"
  to = "https://cash-lvl.ru/:splat"
  status = 301
  force = true

[[redirects]]
  from = "http://www.cash-lvl.ru/*"
  to = "https://cash-lvl.ru/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://www.cash-lvl.ru/*"
  to = "https://cash-lvl.ru/:splat"
  status = 301
  force = true