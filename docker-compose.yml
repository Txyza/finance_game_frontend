version: '3.8'

services:
  # Frontend сервис
  frontend:
    build:
      context: .
      dockerfile: docker/frontend/Dockerfile
    container_name: finance-game-frontend
    environment:
      - NODE_ENV=production
    networks:
      - finance-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Nginx сервис
  nginx:
    build:
      context: .
      dockerfile: docker/nginx/Dockerfile
    container_name: finance-game-nginx
    ports:
      - "80:80"
    depends_on:
      frontend:
        condition: service_healthy
    networks:
      - finance-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3

networks:
  finance-network:
    driver: bridge