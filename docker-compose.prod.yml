
services:
  # Frontend сервис
  frontend:
    build:
      context: .
      dockerfile: docker/frontend/Dockerfile
      target: production
    container_name: cash-lvl-frontend-prod
    environment:
      - NODE_ENV=production
      - PORT=3000
    networks:
      - cash-lvl-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # Nginx reverse proxy
  nginx:
    build:
      context: .
      dockerfile: docker/nginx/Dockerfile
    container_name: cash-lvl-nginx-prod
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      frontend:
        condition: service_healthy
    networks:
      - cash-lvl-network
    restart: unless-stopped
    volumes:
      # SSL certificates
      - ./cert:/etc/nginx/ssl:ro
      # Логи nginx
      - nginx_logs:/var/log/nginx
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"


networks:
  cash-lvl-network:
    driver: bridge
    name: cash-lvl-prod

volumes:
  ssl_data:
    driver: local
  nginx_logs:
    driver: local