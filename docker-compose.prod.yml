
services:
  # Backend database
  postgres:
    image: postgres:15
    container_name: cash-lvl-postgres-prod
    environment:
      POSTGRES_DB: ${POSTGRES_PASSWORD:-finance_game}
      POSTGRES_USER: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - cash-lvl-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U finance_user -d finance_game"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # Backend cache
  redis:
    image: redis:7-alpine
    container_name: cash-lvl-redis-prod
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    networks:
      - cash-lvl-network
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # Backend API
  api:
    build:
      context: ../finance_game_backend
      dockerfile: Dockerfile
    container_name: cash-lvl-api-prod
    environment:
      - POSTGRES_SERVER=postgres
      - POSTGRES_USER=finance_user
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-finance_password_prod}
      - POSTGRES_DB=finance_game
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - SECRET_KEY=${SECRET_KEY:-your-super-secret-key-change-in-production}
      - ENVIRONMENT=production
      - API_V1_STR=${API_V1_STR:-/api/v1}
      - DEBUG=False
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - cash-lvl-network
    restart: unless-stopped
    command: >
      sh -c "
        sleep 5 &&
        alembic upgrade head &&
        uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 4
      "
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import urllib.request; urllib.request.urlopen(\"http://localhost:8000/api/v1/health\")'"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # Frontend сервис
  frontend:
    build:
      context: .
      dockerfile: docker/frontend/Dockerfile
      target: production
      args:
        - VITE_API_URL=${VITE_API_URL:-https://cash-lvl.ru/api}
        - VITE_APP_NAME=${VITE_APP_NAME:-Cash Level}
        - VITE_APP_VERSION=${VITE_APP_VERSION:-1.0.0}
    container_name: cash-lvl-frontend-prod
    environment:
      - NODE_ENV=production
      - PORT=3000
    networks:
      - cash-lvl-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # Nginx reverse proxy
  nginx:
    build:
      context: .
      dockerfile: docker/nginx/Dockerfile
    container_name: cash-lvl-nginx-prod
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      frontend:
        condition: service_healthy
      api:
        condition: service_started
    networks:
      - cash-lvl-network
    restart: unless-stopped
    volumes:
      # SSL certificates
      - ./cert:/etc/nginx/ssl:ro
      # Логи nginx
      - nginx_logs:/var/log/nginx
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"


networks:
  cash-lvl-network:
    driver: bridge
    name: cash-lvl-prod

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  ssl_data:
    driver: local
  nginx_logs:
    driver: local